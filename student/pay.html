<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/6c491f9239.js"></script>
        <link rel="stylesheet" href="pay.css"> 
        <title>Booking spaces</title>
    </head>
    <body>
        <div class="sidebar">
            <div class="logo"></div>
            <ul class="menu">
                <li>
                    <a href="dashboard.html">
                        <i class="fa-regular fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="active">
                    <a href="booking.html">
                        <i class="fa-solid fa-calendar"></i>
                        <span>Book Space</span>
                    </a>
                </li>
                <li>
                    <a href="feedback.html">
                        <i class="fa-regular fa-comment-dots"></i>
                        <span>Give Feedback</span>
                    </a>
                </li>
                <li>
                    <a href="notification.html">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>
                <li>
                    <a href="contact.html">
                        <i class="fa-solid fa-phone"></i>
                        <span>Contact Us</span>
                    </a>
                </li>
                <li>
                    <a href="settings.html">
                       <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="logout">
                    <a href="../role-selection/roleSelection.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log out</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="main--content">
            <div class="header--wrapper">
                <div class="header--title">
                    <span>Hello,</span>
                    <h2>Welcome Back</h2>
                </div>
                <div class="user--info">
                    <div class="search--box">
                        <i class="fa-solid fa-magnifying-glass" id="search"></i>
                        <input type="text" placeholder="search"> 
                    </div>
                    <img src="../images/studentDp.jpg" alt="Joyce Omondi">
                </div>
            </div>
            <div class="payment-card">
            <div class="payment-header">
                <div class="header-text">
                    <h2>Confirm your Bookings</h2>
                    <p>Review your booking details and pay using M-PESA</p>
                    <span class="cancel">
                        <a href="booking.html" class="pay"><i class="fa-solid fa-x"></i></a>
                    </span>
                </div>
            </div>
            <div class="time-form">
                <form action="">
                    <label for="duration">Intended Parking hours</label>
                    <input type="number" name="duration" id="duration" placeholder="e.g 3hrs" min="1" max="24">
                </form>
            </div>
            <section class="booking-details">
                <span>Parking Space</span>
                <h2>P1</h2>
                <span>Amount to pay</span>
                <h2 id="amount">ksh 200</h2>
            </section>
            <form action="" id="paymentForm">
                <label for="phone">M-PESA phone number</label>
                <input type="tel" id="phone" placeholder="0704696930">
                <button type="submit" id="paymentButton">Send Payment Prompt</button>
            </form>   
        </div>
    </body>
</html>
